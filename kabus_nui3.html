<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KABUS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{background:transparent;overflow:hidden;font-family:'Rajdhani',sans-serif;width:100vw;height:100vh;}

/* ═══ LOADING ═══ */
#loading{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;transition:opacity 0.9s ease;
}
#loading.hidden{opacity:0;pointer-events:none;}
.load-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(240,40,60,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(240,40,60,0.05) 1px, transparent 1px);
  background-size:48px 48px;
  animation:gridMove 18s linear infinite;
}
@keyframes gridMove{from{background-position:0 0;}to{background-position:48px 48px;}}
.load-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.92) 100%);
}
.lc{position:absolute;width:56px;height:56px;}
.lc::before,.lc::after{content:'';position:absolute;background:#f0283c;}
.lc::before{width:100%;height:1.5px;top:0;left:0;}
.lc::after{width:1.5px;height:100%;top:0;left:0;}
.lc.tl{top:28px;left:28px;}
.lc.tr{top:28px;right:28px;transform:scaleX(-1);}
.lc.bl{bottom:28px;left:28px;transform:scaleY(-1);}
.lc.br{bottom:28px;right:28px;transform:scale(-1,-1);}
.load-deco{
  position:absolute;width:640px;height:640px;
  border:1px solid rgba(240,40,60,0.08);border-radius:50%;
  animation:decoSpin 22s linear infinite;
}
.load-deco2{
  position:absolute;width:480px;height:480px;
  border:1px solid rgba(240,40,60,0.12);border-radius:50%;
  animation:decoSpin 15s linear infinite reverse;
}
@keyframes decoSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.load-logo-wrap{position:relative;z-index:1;margin-bottom:40px;display:flex;flex-direction:column;align-items:center;}
.load-main-img{
  width:240px;
  filter:drop-shadow(0 0 48px rgba(240,40,60,0.8));
  animation:logoFloat 3.2s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0);filter:drop-shadow(0 0 48px rgba(240,40,60,0.8));}
  50%{transform:translateY(-12px);filter:drop-shadow(0 0 72px rgba(240,40,60,1));}
}
.load-tagline{
  margin-top:14px;font-size:11px;letter-spacing:7px;color:rgba(240,40,60,0.45);
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;
}
.load-bar-area{position:relative;z-index:1;width:300px;}
.load-pct-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.load-pct{font-size:32px;font-weight:700;color:#f0283c;font-family:'JetBrains Mono',monospace;line-height:1;}
.load-pct-label{font-size:10px;color:rgba(240,40,60,0.35);font-family:'JetBrains Mono',monospace;letter-spacing:2.5px;}
.load-track{width:100%;height:2px;background:rgba(240,40,60,0.12);position:relative;}
.load-fill{
  height:2px;background:#f0283c;width:0%;transition:width 0.1s linear;
  box-shadow:0 0 16px rgba(240,40,60,0.95),0 0 32px rgba(240,40,60,0.45);
}
.load-fill::after{
  content:'';position:absolute;right:-2px;top:-4px;
  width:9px;height:9px;border-radius:50%;background:#ff8090;
  box-shadow:0 0 12px rgba(240,40,60,1),0 0 24px rgba(240,40,60,0.7);
}
.load-sub{
  margin-top:16px;font-size:11px;color:rgba(240,40,60,0.3);
  font-family:'JetBrains Mono',monospace;letter-spacing:3.5px;text-transform:uppercase;
  min-height:16px;text-align:center;
}
.load-status-line{
  margin-top:5px;font-size:11px;color:rgba(255,255,255,0.1);
  font-family:'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;
  text-align:center;min-height:16px;
}

/* ═══ NOTIFICATIONS ═══ */
#notif-stack{
  position:fixed;top:24px;left:24px;
  display:flex;flex-direction:column;gap:10px;
  z-index:900;pointer-events:none;width:340px;
}
.notif{
  position:relative;overflow:hidden;display:flex;
  clip-path:inset(0 100% 0 0);
  transition:clip-path 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
  opacity:0;
}
.notif.show{clip-path:inset(0 0% 0 0);opacity:1;}
.notif.hide{clip-path:inset(0 100% 0 0);opacity:0;transition:clip-path 0.3s ease-in, opacity 0.25s ease-in;}
.n-bar{width:4px;flex-shrink:0;}
.n-body{
  flex:1;background:rgba(4,3,8,0.97);backdrop-filter:blur(24px);
  border-top:1px solid rgba(255,255,255,0.04);border-right:1px solid rgba(255,255,255,0.04);
  border-bottom:1px solid rgba(0,0,0,0.7);
  display:flex;align-items:center;gap:14px;padding:14px 18px;
}
.n-icon{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:16px;font-weight:700;
}
.n-text{flex:1;min-width:0;}
.n-title{
  font-size:16px;font-weight:700;color:#f0f0ff;letter-spacing:0.3px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.n-category{
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;margin-top:3px;
}
.n-progress{position:absolute;bottom:0;left:4px;right:0;height:2px;transform-origin:left;}
.notif.show .n-progress{animation:npTimer 2.8s linear forwards 0.1s;}
@keyframes npTimer{from{transform:scaleX(1);}to{transform:scaleX(0);}}
.n-corner{position:absolute;top:0;right:0;width:0;height:0;border-left:18px solid transparent;}

.nt-on .n-bar{background:linear-gradient(to bottom,#4ade80,#16a34a);}
.nt-on .n-icon{background:rgba(74,222,128,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.25);}
.nt-on .n-category{color:rgba(74,222,128,0.55);}
.nt-on .n-progress{background:linear-gradient(to right,#4ade80,transparent);}
.nt-on .n-corner{border-top:18px solid rgba(74,222,128,0.18);}

.nt-off .n-bar{background:linear-gradient(to bottom,#f0283c,#7a0010);}
.nt-off .n-icon{background:rgba(240,40,60,0.12);color:#f0283c;border:1px solid rgba(240,40,60,0.25);}
.nt-off .n-category{color:rgba(240,40,60,0.45);}
.nt-off .n-progress{background:linear-gradient(to right,#f0283c,transparent);}
.nt-off .n-corner{border-top:18px solid rgba(240,40,60,0.18);}

.nt-warn .n-bar{background:linear-gradient(to bottom,#fbbf24,#b45309);}
.nt-warn .n-icon{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.25);}
.nt-warn .n-category{color:rgba(251,191,36,0.45);}
.nt-warn .n-progress{background:linear-gradient(to right,#fbbf24,transparent);}
.nt-warn .n-corner{border-top:18px solid rgba(251,191,36,0.18);}

.nt-info .n-bar{background:linear-gradient(to bottom,#60a5fa,#1d4ed8);}
.nt-info .n-icon{background:rgba(96,165,250,0.12);color:#60a5fa;border:1px solid rgba(96,165,250,0.25);}
.nt-info .n-category{color:rgba(96,165,250,0.45);}
.nt-info .n-progress{background:linear-gradient(to right,#60a5fa,transparent);}
.nt-info .n-corner{border-top:18px solid rgba(96,165,250,0.18);}

/* ═══ MAIN MENU — CINEMATIC ═══ */
#menu{
  position:fixed;top:50%;right:28px;
  transform:translateY(-50%);
  width:340px;
  display:none;flex-direction:column;
  z-index:100;
}
#menu.visible{
  display:flex;
  animation:menuIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes menuIn{
  from{opacity:0;transform:translateY(-50%) translateX(20px) scale(0.97);}
  to{opacity:1;transform:translateY(-50%) translateX(0) scale(1);}
}

/* ambient glow behind menu */
#menu::before{
  content:'';
  position:absolute;inset:-40px -30px -40px -60px;
  background:
    radial-gradient(ellipse 70% 60% at 80% 50%, rgba(240,40,60,0.18), transparent 70%),
    radial-gradient(ellipse 50% 40% at 90% 30%, rgba(180,20,50,0.12), transparent 60%);
  pointer-events:none;z-index:-1;
  filter:blur(2px);
}

.menu-shell{
  background:rgba(4,2,8,0.97);
  border:1px solid rgba(240,40,60,0.22);
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 48px 120px rgba(0,0,0,0.95),
    0 0 0 1px rgba(255,255,255,0.03),
    inset 0 1px 0 rgba(255,255,255,0.05),
    0 0 100px rgba(240,40,60,0.08),
    0 0 40px rgba(240,40,60,0.06);
}

.menu-banner-wrap{position:relative;overflow:hidden;height:140px;}
.menu-banner{width:100%;height:100%;object-fit:cover;display:block;opacity:0.8;}
.menu-banner-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(4,2,8,0.98) 100%),
    linear-gradient(105deg, rgba(240,40,60,0.14) 0%, transparent 55%);
}
.menu-banner-scan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.14) 2px,rgba(0,0,0,0.14) 3px);
}

.tabs-row{
  display:flex;padding:8px 10px 0;gap:2px;position:relative;
}
.tabs-row::after{
  content:'';position:absolute;bottom:0;left:10px;right:10px;height:1px;
  background:rgba(255,255,255,0.04);
}
.tab{
  flex:1;padding:8px 3px;
  font-size:14px;font-weight:700;letter-spacing:0.6px;
  color:rgba(255,255,255,0.45);
  text-shadow:0 0 8px rgba(255,255,255,0.15);
  background:transparent;border:none;cursor:pointer;
  border-radius:5px 5px 0 0;
  transition:all 0.15s ease;
  font-family:'Rajdhani',sans-serif;
  position:relative;white-space:nowrap;text-align:center;
}
.tab:hover{color:#ffffff;text-shadow:0 0 12px rgba(255,255,255,0.7);}
.tab.active{
  color:#ffffff;
  text-shadow:0 0 14px rgba(240,40,60,0.95), 0 0 4px rgba(255,255,255,0.4);
}
.tab.active::after{
  content:'';position:absolute;bottom:0;left:4px;right:4px;height:2px;
  background:linear-gradient(to right,transparent,#f0283c,transparent);
  box-shadow:0 0 12px rgba(240,40,60,0.8);
}

.pdots{display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 0 4px;}
.pd{width:4px;height:4px;border-radius:50%;background:rgba(240,40,60,0.15);transition:all 0.2s ease;}
.pd.a{background:#f0283c;width:16px;border-radius:2px;box-shadow:0 0 8px rgba(240,40,60,0.6);}

.items{
  padding:8px 10px 12px;
  max-height:420px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(240,40,60,0.2) transparent;
}
.items::-webkit-scrollbar{width:3px;}
.items::-webkit-scrollbar-thumb{background:rgba(240,40,60,0.25);}

.isep{
  font-size:10px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;
  color:rgba(240,40,60,0.25);
  padding:10px 12px 4px;pointer-events:none;
  display:flex;align-items:center;gap:10px;
}
.isep::after{content:'';flex:1;height:1px;background:rgba(240,40,60,0.1);}

.item{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 12px;margin-bottom:2px;
  border-radius:7px;cursor:pointer;
  border:1px solid transparent;
  position:relative;overflow:hidden;
  transition:background 0.12s ease,border-color 0.12s ease;
}
.item::before{
  content:'';position:absolute;left:0;top:5px;bottom:5px;
  width:0;background:#f0283c;border-radius:0 2px 2px 0;
  transition:width 0.15s ease;
  box-shadow:0 0 10px rgba(240,40,60,0.7);
}
.item.selected::before{width:3px;}
.item.selected::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 8% 50%,rgba(240,40,60,0.1),transparent 70%);
  pointer-events:none;
}
.item:hover:not(.selected){background:rgba(255,255,255,0.025);}
.item.selected{
  background:rgba(240,40,60,0.09);
  border-color:rgba(240,40,60,0.22);
}

.item-label{
  font-size:16px;font-weight:600;
  color:rgba(255,255,255,0.38);
  position:relative;z-index:1;
  transition:color 0.12s ease;
  letter-spacing:0.3px;
}
.item.selected .item-label{
  color:rgba(255,255,255,0.96);
  text-shadow:0 0 12px rgba(255,255,255,0.25);
}

.item-right{display:flex;align-items:center;gap:6px;position:relative;z-index:1;}

.tag{
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;
  letter-spacing:1.2px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;
}
.tag-FULL{background:rgba(240,40,60,0.14);color:#f0283c;border:1px solid rgba(240,40,60,0.22);}
.tag-SAFE{background:rgba(74,222,128,0.1);color:#4ade80;border:1px solid rgba(74,222,128,0.18);}
.tag-LEGIT{background:rgba(96,165,250,0.1);color:#60a5fa;border:1px solid rgba(96,165,250,0.18);}
.tag-STRONG{background:rgba(251,191,36,0.1);color:#fbbf24;border:1px solid rgba(251,191,36,0.18);}
.tag-VOICE{background:rgba(192,132,252,0.1);color:#c084fc;border:1px solid rgba(192,132,252,0.18);}
.tag-NEW{background:rgba(240,40,60,0.14);color:#f0283c;border:1px solid rgba(240,40,60,0.22);}
.tag-OLD{background:rgba(60,60,80,0.14);color:rgba(255,255,255,0.22);border:1px solid rgba(60,60,80,0.12);}
.tag-FELOX{background:rgba(248,113,113,0.1);color:#f87171;border:1px solid rgba(248,113,113,0.18);}

.toggle{
  width:34px;height:18px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:9px;position:relative;
  transition:all 0.2s ease;
}
.toggle.on{
  background:rgba(240,40,60,0.85);
  border-color:rgba(240,40,60,0.55);
  box-shadow:0 0 14px rgba(240,40,60,0.4);
}
.toggle::after{
  content:'';position:absolute;top:2.5px;left:2.5px;
  width:11px;height:11px;border-radius:50%;
  background:rgba(255,255,255,0.45);
  transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1),background 0.2s;
}
.toggle.on::after{transform:translateX(15px);background:#fff;}

.sval{
  font-size:13px;color:rgba(240,40,60,0.9);
  font-family:'JetBrains Mono',monospace;min-width:26px;text-align:right;
  text-shadow:0 0 8px rgba(240,40,60,0.4);
}

.arrow{font-size:14px;color:rgba(255,255,255,0.15);}
.item.selected .arrow{color:rgba(240,40,60,0.85);}

.menu-foot{
  display:flex;justify-content:space-between;
  padding:8px 14px;
  border-top:1px solid rgba(255,255,255,0.04);
  font-size:10px;color:rgba(255,255,255,0.12);
  font-family:'JetBrains Mono',monospace;letter-spacing:0.6px;
}

/* ═══ CROSSHAIR ═══ */
#crosshair{
  position:fixed;top:50%;left:50%;
  width:10px;height:10px;
  transform:translate(-50%,-50%);
  border:2px solid rgba(240,40,60,0.95);border-radius:50%;
  box-shadow:0 0 12px rgba(240,40,60,0.8);
  display:none;z-index:160;pointer-events:none;
}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(240,40,60,0.9);}
#crosshair::before{width:2px;height:16px;top:50%;left:50%;transform:translate(-50%,-50%);}
#crosshair::after{width:16px;height:2px;top:50%;left:50%;transform:translate(-50%,-50%);}
#crosshair.visible{display:block;}

/* ═══ FREECAM HUD ═══ */
#freecam-hud{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  text-align:center;display:none;z-index:150;pointer-events:none;
}
#freecam-hud.visible{display:block;}
.fc-prev,.fc-next{font-size:13px;color:#fff;opacity:0.4;margin:3px 0;text-shadow:0 1px 6px rgba(0,0,0,0.95);}
.fc-current{
  font-size:22px;font-weight:700;color:#f0283c;
  text-shadow:0 0 28px rgba(240,40,60,0.9), 0 0 8px rgba(240,40,60,0.5);
  margin:5px 0;letter-spacing:1.2px;
}
.fc-hint{margin-top:10px;font-size:10px;color:rgba(255,255,255,0.25);font-family:'JetBrains Mono',monospace;letter-spacing:1.8px;}
</style>
</head>
<body>

<div id="loading">
  <div class="load-grid"></div>
  <div class="load-vignette"></div>
  <div class="lc tl"></div><div class="lc tr"></div>
  <div class="lc bl"></div><div class="lc br"></div>
  <div class="load-deco"></div>
  <div class="load-deco2"></div>
  <div class="load-logo-wrap">
    <img class="load-main-img" src="https://i.ibb.co/dJLSqP61/Alevli-Metalik-KBS-Yaz-s.png" alt="KABUS">
    <div class="load-tagline">executor suite · fivem</div>
  </div>
  <div class="load-bar-area">
    <div class="load-pct-row">
      <div class="load-pct" id="loadPct">0<span style="font-size:18px;opacity:0.5;">%</span></div>
      <div class="load-pct-label" id="loadPctLbl">LOADING</div>
    </div>
    <div class="load-track"><div class="load-fill" id="loadBar"></div></div>
    <div class="load-sub" id="loadSub">STANDBY</div>
    <div class="load-status-line" id="loadStatus">AWAITING INJECTION</div>
  </div>
</div>

<div id="notif-stack"></div>

<div id="menu">
  <div class="menu-shell">
    <div class="menu-banner-wrap">
      <img class="menu-banner" src="https://i.ibb.co/DStC5vd/Kabus-Karanl-k-K-z-l-Ta.png" alt="">
      <div class="menu-banner-overlay"></div>
      <div class="menu-banner-scan"></div>
    </div>
    <div class="tabs-row" id="tabs"></div>
    <div class="pdots" id="pdots"></div>
    <div class="items" id="items"></div>
    <div class="menu-foot">
      <span>↑↓ NAVIGATE</span>
      <span>←→ TAB / SLIDE</span>
      <span>ENTER SELECT</span>
    </div>
  </div>
</div>

<div id="crosshair"></div>
<div id="freecam-hud">
  <div class="fc-prev" id="fcPrev"></div>
  <div class="fc-current" id="fcCurrent"></div>
  <div class="fc-next" id="fcNext"></div>
  <div class="fc-hint">WHEEL CYCLE · LMB USE · INS EXIT</div>
</div>

<script>
const $tabs=document.getElementById('tabs');
const $items=document.getElementById('items');
const $menu=document.getElementById('menu');
const $load=document.getElementById('loading');
const $pdots=document.getElementById('pdots');
const $ns=document.getElementById('notif-stack');
let cTabs=[],cItems=[],cPage=0,cSel=0;

function renderTabs(){
  $tabs.innerHTML='';
  const mx=6,start=Math.max(0,Math.min(cPage-Math.floor(mx/2),cTabs.length-mx));
  for(let i=start;i<start+mx&&i<cTabs.length;i++){
    const b=document.createElement('button');
    b.className='tab'+(i===cPage?' active':'');
    b.textContent=cTabs[i];
    $tabs.appendChild(b);
  }
  $pdots.innerHTML='';
  cTabs.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='pd'+(i===cPage?' a':'');
    $pdots.appendChild(d);
  });
}

function renderItems(){
  $items.innerHTML='';
  cItems.forEach((item,i)=>{
    if(item.type==='_sep'){
      const s=document.createElement('div');
      s.className='isep';s.textContent=item.label;
      $items.appendChild(s);return;
    }
    const el=document.createElement('div');
    el.className='item'+(i===cSel?' selected':'');
    let right='';
    if(item.type==='toggle') right=`<div class="toggle ${item.value?'on':''}"></div>`;
    else if(item.type==='slider') right=`<span class="sval">${item.value}</span>`;
    else right=`<span class="arrow">›</span>`;
    const tag=item.tag?`<span class="tag tag-${item.tag}">${item.tag}</span>`:'';
    el.innerHTML=`<span class="item-label">${item.label}</span><div class="item-right">${tag}${right}</div>`;
    $items.appendChild(el);
  });
  const sel=$items.children[cSel];
  if(sel) sel.scrollIntoView({block:'nearest',behavior:'smooth'});
}

const NTYPE=msg=>{
  const m=(msg||'').toLowerCase();
  if(/\bon\b|enabl|load|inject|spawn|open|full|repair|reviv|heal|sav|start|activ/.test(m)) return'on';
  if(/\boff\b|disabl|kill|delet|strip|cancel|clos|blown|suicid|explo/.test(m)) return'off';
  if(/speed|fov|range|boost|mult|noclip|fire|stun|freez|drunk|launch|attach|rob|bypass|v[2-5]/.test(m)) return'warn';
  return'info';
};
const NICON={on:'✓',off:'✕',warn:'⚡',info:'ℹ'};
const NCAT={on:'FEATURE ACTIVE',off:'FEATURE DISABLED',warn:'ACTION',info:'SYSTEM'};

function pushNotif(msg){
  while($ns.children.length>=5){
    const old=$ns.firstChild;
    if(old){old.classList.add('hide');setTimeout(()=>old.parentNode&&old.parentNode.removeChild(old),300);}
    break;
  }
  const t=NTYPE(msg);
  const el=document.createElement('div');
  el.className=`notif nt-${t}`;
  el.innerHTML=`
    <div class="n-bar"></div>
    <div class="n-body">
      <div class="n-icon">${NICON[t]}</div>
      <div class="n-text">
        <div class="n-title">${msg}</div>
        <div class="n-category">${NCAT[t]}</div>
      </div>
    </div>
    <div class="n-corner"></div>
    <div class="n-progress"></div>
  `;
  $ns.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  setTimeout(()=>{el.classList.add('hide');setTimeout(()=>el.parentNode&&$ns.removeChild(el),300);},3000);
}

window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||!d.action) return;
  switch(d.action){
    case 'loading':{
      const p=Math.round((d.progress||0)*100);
      document.getElementById('loadBar').style.width=p+'%';
      document.getElementById('loadPct').innerHTML=p+'<span style="font-size:18px;opacity:0.5;">%</span>';
      if(p>=100) document.getElementById('loadPctLbl').textContent='COMPLETE';
      if(d.playerName) document.getElementById('loadStatus').textContent='PLAYER: '+d.playerName.toUpperCase();
      if(d.subText) document.getElementById('loadSub').textContent=d.subText.toUpperCase();
      if(d.done) setTimeout(()=>$load.classList.add('hidden'),600);
      break;
    }
    case 'setVisible':
      if(d.visible) $menu.classList.add('visible');
      else{$menu.classList.remove('visible');$menu.style.animation='none';requestAnimationFrame(()=>$menu.style.animation='');}
      break;
    case 'update':
      if(d.tabs) cTabs=d.tabs;
      if(d.items) cItems=d.items;
      if(d.page!==undefined) cPage=d.page;
      if(d.selected!==undefined) cSel=d.selected;
      renderTabs();renderItems();
      break;
    case 'toast': pushNotif(d.message||''); break;
    case 'freecam':
      if(d.visible){
        document.getElementById('freecam-hud').classList.add('visible');
        document.getElementById('crosshair').classList.add('visible');
        document.getElementById('fcPrev').textContent=d.prev||'';
        document.getElementById('fcCurrent').textContent='● '+(d.current||'');
        document.getElementById('fcNext').textContent=d.next||'';
      } else {
        document.getElementById('freecam-hud').classList.remove('visible');
        document.getElementById('crosshair').classList.remove('visible');
      }
      break;
  }
});

fetch(`https://${typeof GetParentResourceName!=='undefined'?GetParentResourceName():'kabus'}/nuiReady`,{method:'POST',body:JSON.stringify({})}).catch(()=>{});
</script>
